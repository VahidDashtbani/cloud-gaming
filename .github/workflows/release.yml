name: Build and Release Cloud Gaming

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/linux-relay ./cmd/linux-relay
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/windows-agent.exe ./cmd/windows-agent

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-gaming-binaries
          path: bin/

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/linux-relay
            bin/windows-agent.exe
            deploy/windows/install-windows.ps1
            deploy/windows/installer.iss
